<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fila da Bolacha 🍪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     PALETA DA BOLACHA
     creme  #FFF8EE  fundo da página
     areia  #F7E9D2  cards secundários
     caramelo #E8B04B  botões e destaques
     bolacha  #A9713B  cabeçalho e detalhes
     chocolate #4A2E1C  textos
     menta  #7FB069  ação principal ("é sua vez!")
     ============================================================ */
  :root {
    --creme: #FFF8EE;
    --areia: #F7E9D2;
    --caramelo: #E8B04B;
    --bolacha: #A9713B;
    --chocolate: #4A2E1C;
    --menta: #7FB069;
    --menta-escuro: #1E3A14;
    --borda: #E0D5C5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--creme);
    color: var(--chocolate);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- Cabeçalho ---------- */
  header {
    width: 100%;
    background: var(--bolacha);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .cookie-logo {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--caramelo);
    position: relative;
    flex-shrink: 0;
  }
  .cookie-logo::before, .cookie-logo::after {
    content: "";
    position: absolute;
    background: var(--chocolate);
    border-radius: 50%;
  }
  .cookie-logo::before { width: 7px; height: 7px; top: 10px; left: 11px; }
  .cookie-logo::after  { width: 6px; height: 6px; top: 22px; left: 24px; }
  header h1 {
    font-family: 'Baloo 2', cursive;
    font-size: 26px;
    color: var(--creme);
    line-height: 1.1;
  }
  header p { font-size: 13px; color: #F0DCBB; }

  main {
    width: 100%;
    max-width: 560px;
    padding: 28px 20px 60px;
  }

  /* ---------- Card da vez ---------- */
  .card {
    background: #fff;
    border: 1px solid var(--borda);
    border-radius: 18px;
    padding: 26px 22px;
    text-align: center;
  }
  .card .rotulo {
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--bolacha);
    font-weight: 700;
  }
  .card .nome {
    font-family: 'Baloo 2', cursive;
    font-size: 40px;
    margin: 4px 0 0;
  }
  .card .semana { font-size: 14px; color: var(--bolacha); margin-bottom: 18px; }

  .botoes { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  button {
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    border-radius: 24px;
    padding: 12px 24px;
    cursor: pointer;
    transition: transform .1s ease, filter .15s ease;
  }
  button:hover { filter: brightness(1.05); }
  button:active { transform: scale(.96); }

  .btn-principal {
    background: var(--menta);
    color: var(--menta-escuro);
    border: none;
  }
  .btn-secundario {
    background: transparent;
    color: var(--bolacha);
    border: 1.5px solid #C9A57E;
  }
  .btn-principal:disabled {
    background: var(--areia);
    color: #B08A5E;
    cursor: default;
  }

  .msg {
    margin-top: 14px;
    font-size: 14px;
    font-weight: 600;
    color: #3B6D11;
    min-height: 20px;
  }

  /* ---------- Fila ---------- */
  h2 {
    font-family: 'Baloo 2', cursive;
    font-size: 20px;
    margin: 26px 0 12px;
  }
  .pessoa {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    border: 1px solid #EDE2D0;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 8px;
  }
  .pessoa .ordem {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--caramelo);
    color: var(--chocolate);
    font-weight: 700;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .pessoa .quando { margin-left: auto; font-size: 13px; color: #B08A5E; }
  .pessoa .remover {
    background: none; border: none;
    color: #C9A57E; font-size: 16px;
    padding: 4px 6px; border-radius: 8px;
  }
  .pessoa .remover:hover { color: #D85A30; }

  /* ---------- Adicionar pessoa ---------- */
  .adicionar {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .adicionar input {
    flex: 1;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    padding: 11px 16px;
    border: 1.5px solid var(--borda);
    border-radius: 24px;
    background: #fff;
    color: var(--chocolate);
    outline: none;
  }
  .adicionar input:focus { border-color: var(--caramelo); }
  .adicionar button {
    background: var(--caramelo);
    color: var(--chocolate);
    border: none;
    padding: 11px 20px;
  }

  /* ---------- Rodapé divertido ---------- */
  .destaque {
    margin-top: 24px;
    background: var(--areia);
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 14px;
    color: #633806;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* ---------- Confete ---------- */
  .confete {
    position: fixed;
    top: -12px;
    pointer-events: none;
    z-index: 10;
    transition: transform 1.4s ease-in, opacity 1.4s;
  }

  @media (max-width: 480px) {
    .card .nome { font-size: 32px; }
    header h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<header>
  <div class="cookie-logo" aria-hidden="true"></div>
  <div>
    <h1>Fila da Bolacha</h1>
    <p>quem traz o lanche essa semana?</p>
  </div>
</header>

<main>
  <section class="card">
    <p class="rotulo">É a vez de</p>
    <p class="nome" id="atual">—</p>
    <p class="semana" id="semana"></p>
    <div class="botoes">
      <button class="btn-principal" id="btnTrouxe" onclick="jaTrouxe()">✓ Já trouxe!</button>
      <button class="btn-secundario" onclick="pularVez()">⇄ Pular a vez</button>
    </div>
    <p class="msg" id="msg"></p>
  </section>

  <h2>Próximos na fila</h2>
  <div id="fila"></div>

  <div class="adicionar">
    <input type="text" id="novoNome" placeholder="Nome do colega novo..." maxlength="30"
           onkeydown="if(event.key==='Enter') adicionarPessoa()">
    <button onclick="adicionarPessoa()">+ Adicionar</button>
  </div>

  <div class="destaque">
    <span aria-hidden="true">🏆</span>
    <span>Dica: combine com a equipe uma votação da melhor bolacha do mês!</span>
  </div>
</main>

<script>
/* ==============================================================
   FILA DA BOLACHA — lógica principal
   O estado é salvo no localStorage do navegador, então a fila
   continua de onde parou mesmo fechando a página.
   Para uso em equipe, todos devem abrir no mesmo computador,
   OU você pode evoluir para um backend (Firebase, Google Sheets).
   ============================================================== */

const CHAVE = "fila-da-bolacha-v1";

// Estado padrão usado na primeira visita
let estado = {
  fila: ["Maria", "João", "Carlos", "Ana", "Pedro"],
  // segunda-feira da semana atual do primeiro da fila (timestamp)
  inicioSemana: segundaDaSemana(new Date()).getTime(),
  confirmouEstaSemana: false
};

// ---------- Persistência ----------
function salvar() {
  localStorage.setItem(CHAVE, JSON.stringify(estado));
}
function carregar() {
  const salvo = localStorage.getItem(CHAVE);
  if (salvo) {
    try { estado = JSON.parse(salvo); } catch (e) { /* mantém padrão */ }
  }
}

// ---------- Datas ----------
function segundaDaSemana(data) {
  const d = new Date(data);
  const dia = d.getDay(); // 0 = domingo
  const diff = (dia === 0 ? -6 : 1 - dia);
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function formatarSemana(inicio) {
  const meses = ["janeiro","fevereiro","março","abril","maio","junho",
                 "julho","agosto","setembro","outubro","novembro","dezembro"];
  const fim = new Date(inicio);
  fim.setDate(fim.getDate() + 4); // segunda a sexta
  return `semana de ${inicio.getDate()} a ${fim.getDate()} de ${meses[fim.getMonth()]}`;
}

// Avança a fila automaticamente se já passaram semanas desde a última visita
function sincronizarComHoje() {
  const hoje = segundaDaSemana(new Date()).getTime();
  const umaSemana = 7 * 24 * 60 * 60 * 1000;
  while (estado.inicioSemana + umaSemana <= hoje) {
    estado.fila.push(estado.fila.shift());
    estado.inicioSemana += umaSemana;
    estado.confirmouEstaSemana = false;
  }
}

// ---------- Ações ----------
function jaTrouxe() {
  if (estado.confirmouEstaSemana) return;
  estado.confirmouEstaSemana = true;
  salvar();
  mostrarMsg(`Missão cumprida, ${estado.fila[0]}! 🍪`);
  soltarConfete();
  render();
}

function pularVez() {
  if (estado.fila.length < 2) return;
  const quem = estado.fila[0];
  [estado.fila[0], estado.fila[1]] = [estado.fila[1], estado.fila[0]];
  estado.confirmouEstaSemana = false;
  salvar();
  mostrarMsg(`${quem} trocou a vez com ${estado.fila[0]}.`);
  render();
}

function adicionarPessoa() {
  const input = document.getElementById("novoNome");
  const nome = input.value.trim();
  if (!nome) return;
  if (estado.fila.some(n => n.toLowerCase() === nome.toLowerCase())) {
    mostrarMsg(`${nome} já está na fila!`);
    return;
  }
  estado.fila.push(nome);
  input.value = "";
  salvar();
  render();
}

function removerPessoa(indice) {
  const nome = estado.fila[indice + 1]; // +1 porque a lista mostra a partir do 2º
  if (!confirm(`Remover ${nome} da fila?`)) return;
  estado.fila.splice(indice + 1, 1);
  salvar();
  render();
}

// ---------- Interface ----------
function mostrarMsg(texto) {
  const el = document.getElementById("msg");
  el.textContent = texto;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.textContent = "", 3500);
}

function render() {
  document.getElementById("atual").textContent = estado.fila[0] || "ninguém 😢";
  document.getElementById("semana").textContent =
    formatarSemana(new Date(estado.inicioSemana));

  const btn = document.getElementById("btnTrouxe");
  btn.disabled = estado.confirmouEstaSemana;
  btn.textContent = estado.confirmouEstaSemana ? "✓ Bolacha entregue!" : "✓ Já trouxe!";

  const cont = document.getElementById("fila");
  cont.innerHTML = "";
  estado.fila.slice(1).forEach((nome, i) => {
    const div = document.createElement("div");
    div.className = "pessoa";

    const ordem = document.createElement("span");
    ordem.className = "ordem";
    ordem.textContent = i + 1;

    const nomeEl = document.createElement("span");
    nomeEl.textContent = nome;

    const quando = document.createElement("span");
    quando.className = "quando";
    const d = new Date(estado.inicioSemana);
    d.setDate(d.getDate() + 7 * (i + 1));
    quando.textContent = `semana de ${d.getDate()}/${d.getMonth() + 1}`;

    const remover = document.createElement("button");
    remover.className = "remover";
    remover.textContent = "✕";
    remover.title = `Remover ${nome}`;
    remover.onclick = () => removerPessoa(i);

    div.append(ordem, nomeEl, quando, remover);
    cont.appendChild(div);
  });
}

// ---------- Confete ----------
function soltarConfete() {
  const cores = ["#E8B04B", "#A9713B", "#7FB069", "#D85A30", "#F0997B"];
  for (let i = 0; i < 36; i++) {
    const c = document.createElement("span");
    c.className = "confete";
    const tamanho = 6 + Math.random() * 8;
    c.style.left = Math.random() * 100 + "vw";
    c.style.width = tamanho + "px";
    c.style.height = tamanho + "px";
    c.style.background = cores[i % cores.length];
    c.style.borderRadius = Math.random() > 0.5 ? "50%" : "3px";
    document.body.appendChild(c);
    requestAnimationFrame(() => {
      c.style.transform =
        `translateY(${window.innerHeight + 60}px) rotate(${Math.random() * 540}deg)`;
      c.style.opacity = "0";
    });
    setTimeout(() => c.remove(), 1600);
  }
}

// ---------- Inicialização ----------
carregar();
sincronizarComHoje();
salvar();
render();
</script>
</body>
</html>
